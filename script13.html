<body>

<h2>Resolver Equação do 2º Grau</h2>

<button onclick="calcular()">Iniciar</button>

<script>
function calcular() {

    var a = parseFloat(prompt("Digite o valor de a:"));
    var b = parseFloat(prompt("Digite o valor de b:"));
    var c = parseFloat(prompt("Digite o valor de c:"));

    if (a == 0) {
        alert("Isso não é uma equação do 2º grau, porque 'a' não pode ser zero.");
    } else {

        var delta = (b * b) - (4 * a * c);

        if (delta < 0) {
            alert("Não tem raízes reais, porque o delta deu negativo.");
        } else if (delta == 0) {

            var x = (-b) / (2 * a);
            alert("Só existe uma raiz real: " + x);

        } else {

            var x1 = (-b + Math.sqrt(delta)) / (2 * a);
            var x2 = (-b - Math.sqrt(delta)) / (2 * a);

            alert("Achei duas raízes:");
            alert("X1 = " + x1);
            alert("X2 = " + x2);
        }
    }
}
</script>
