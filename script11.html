    <style>
        header{
            text-align:center;

            border-bottom:2px 
        }

        main{
            max-width:1000px;

            background:#67a6ff;

         button{padding:20px;

         body{background-color: #d6f5ff;}
         a{color:#64b9ff ;
        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<h2>Notas do Aluno</h2>

<button onclick="calcular()">Calcular Média</button>

<script>
function calcular() {

    var nota1 = parseFloat(prompt("Digite a primeira nota:"));
    var nota2 = parseFloat(prompt("Digite a segunda nota:"));

    var media = (nota1 + nota2) / 2;
    var conceito;

    if (media >= 9 && media <= 10) {
        conceito = "A";
    } else if (media >= 7.5) {
        conceito = "B";
    } else if (media >= 6) {
        conceito = "C";
    } else if (media >= 4) {
        conceito = "D";
    } else {
        conceito = "E";
    }

    alert("Nota 1: " + nota1);
    alert("Nota 2: " + nota2);
    alert("Média: " + media);
    alert("Conceito: " + conceito);

    if (conceito == "A" || conceito == "B" || conceito == "C") {
        alert("Situação: APROVADO");
    } else {
        alert("Situação: REPROVADO");
    }

}
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
