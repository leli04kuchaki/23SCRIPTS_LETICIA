        header{

        main{
            max-width:1000px;

            background:#67a6ff;

         button{padding:20px;

        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;

            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<h2>Separar número</h2>

<button onclick="verificar()">Iniciar</button>

<script>
function verificar() {

    var numero = parseInt(prompt("Digite um número menor que 1000:"));

    if (numero < 0 || numero >= 1000) {
        alert("Número inválido!");
    } else {

        var centenas = parseInt(numero / 100);
        var resto = numero % 100;

        var dezenas = parseInt(resto / 10);
        var unidades = resto % 10;

        var texto = "";


        if (centenas == 1) {
            texto = texto + "1 centena";
        } else if (centenas > 1) {
            texto = texto + centenas + " centenas";
        }

      
        if (dezenas == 1) {
            if (texto != "") {
                texto = texto + ", ";
            }
            texto = texto + "1 dezena";
        } else if (dezenas > 1) {
            if (texto != "") {
                texto = texto + ", ";
            }
            texto = texto + dezenas + " dezenas";
        }

        
        if (unidades == 1) {
            if (texto != "") {
                texto = texto + " e ";
            }
            texto = texto + "1 unidade";
        } else if (unidades > 1) {
            if (texto != "") {
                texto = texto + " e ";
            }
            texto = texto + unidades + " unidades";
        }

        alert(texto);
    }

}
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
</html>
