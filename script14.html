<head>

    <style>
        header{
            text-align:center;

            border-bottom:2px 
        }

        main{
            max-width:1000px;

        section{
            background:#67a6ff;

        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<h2>Verificar Ano Bissexto</h2>

<button onclick="verificar()">Iniciar</button>

<script>
function verificar() {

    var ano = parseInt(prompt("Digite um ano:"));

    if (ano % 4 == 0) {

        if (ano % 100 == 0 && ano % 400 != 0) {
            alert("O ano de " + ano + " NÃO é bissexto.");
        } else {
            alert("O ano de " + ano + " é bissexto.");
        }

    } else {
        alert("O ano de " + ano + " NÃO é bissexto.");
    }

}
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
