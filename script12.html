<body>

<h2>Verificar Triângulo</h2>

<button onclick="verificar()">Verificar</button>

<script>
function verificar() {

    var a = parseFloat(prompt("Digite o primeiro lado:"));
    var b = parseFloat(prompt("Digite o segundo lado:"));
    var c = parseFloat(prompt("Digite o terceiro lado:"));

    if (a + b > c && a + c > b && b + c > a) {

        alert("Os valores formam um triângulo");

        if (a == b && b == c) {
            alert("Tipo: Equilátero");
        } else if (a == b || a == c || b == c) {
            alert("Tipo: Isósceles");
        } else {
            alert("Tipo: Escaleno");
        }

    } else {
        alert("Os valores NÃO formam um triângulo");
    }

}
</script>
