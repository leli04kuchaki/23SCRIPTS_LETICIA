<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Investigação</title>
    <style>
        header{
            text-align:center;
            padding:20px;
            background:#549bff;
            border-bottom:2px 
        }

        main{
            max-width:1000px;
            margin:auto;
            padding:20px; ;}
        section{
            background:#67a6ff;
            margin:20px 0;
            padding:20px;
            border-radius:15px}
           h1,h2{color:#005092}
          footer{text-align:center;
            padding: 60px;
            background-color: #549bff;
            
          } 
         button{padding:20px; 
            background-color: #5990dd;
            color:white;
            margin: 3px;
            border:none;
            border-radius:8px}
         body{background-color: #d6f5ff;}
         a{color:#64b9ff ;
        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<script>
function perguntar(pergunta) {
    var resposta = prompt(pergunta + " (s/n)");

    if (resposta == "s" || resposta == "S") {
        return 1;
    } else {
        return 0;
    }
}

var total = 0;

total += perguntar("Telefonou para a vítima?");
total += perguntar("Esteve no local do crime?");
total += perguntar("Mora perto da vítima?");
total += perguntar("Devia para a vítima?");
total += perguntar("Já trabalhou com a vítima?");

var classificacao = "";

if (total == 2) {
    classificacao = "Suspeita";
}
else if (total == 3 || total == 4) {
    classificacao = "Cúmplice";
}
else if (total == 5) {
    classificacao = "Assassino";
}
else {
    classificacao = "Inocente";
}

alert("Classificação: " + classificacao);
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
</html>
