          }

<body>

<script>
var morango = parseFloat(prompt("Quantidade de morango (kg):"));
var maca = parseFloat(prompt("Quantidade de maçã (kg):"));

var precoMorango = 0;
var precoMaca = 0;
if (morango <= 5) {
    precoMorango = 24.00;
} else {
    precoMorango = 20.00;
}

if (maca <= 5) {
    precoMaca = 14.80;
} else {
    precoMaca = 12.40;
}

var total = (morango * precoMorango) + (maca * precoMaca);
var totalKg = morango + maca;

if (totalKg > 12 || total > 180) {
    total = total - (total * 0.10);
}
alert("Total a pagar: R$ " + total.toFixed(2));
</script>
