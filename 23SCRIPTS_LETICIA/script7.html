<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Turno de Estudo</title>
    <style>
        header{
            text-align:center;
            padding:20px;
            background:#549bff;
            border-bottom:2px 
        }

        main{
            max-width:1000px;
            margin:auto;
            padding:20px; ;}
        section{
            background:#67a6ff;
            margin:20px 0;
            padding:20px;
            border-radius:15px}
           h1,h2{color:#005092}
          footer{text-align:center;
            padding: 60px;
            background-color: #549bff;
            
          } 
         button{padding:20px; 
            background-color: #5990dd;
            color:white;
            margin: 3px;
            border:none;
            border-radius:8px}
         body{background-color: #d6f5ff;}
         a{color:#64b9ff ;
        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

    <h2>Qual é o seu turno?</h2>

    Digite M para Matutino, V para Vespertino ou N para Noturno.<br><br>

    <input type="text" id="turno" maxlength="1">

    <button onclick="verificar()">Verificar</button>

    <script>
        function verificar() {

            var turno = document.getElementById("turno").value;

            if (turno == "M" || turno == "m") {
                alert("Bom Dia!");
            } else if (turno == "V" || turno == "v") {
                alert("Boa Tarde!");
            } else if (turno == "N" || turno == "n") {
                alert("Boa Noite!");
            } else {
                alert("Valor Inválido!");
            }

        }
    </script>
    <a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
</html>
