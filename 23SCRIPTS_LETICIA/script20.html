<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <style>
        header{
            text-align:center;
            padding:20px;
            background:#549bff;
            border-bottom:2px 
        }

        main{
            max-width:1000px;
            margin:auto;
            padding:20px; ;}
        section{
            background:#67a6ff;
            margin:20px 0;
            padding:20px;
            border-radius:15px}
           h1,h2{color:#005092}
          footer{text-align:center;
            padding: 60px;
            background-color: #549bff;
            
          } 
         button{padding:20px; 
            background-color: #5990dd;
            color:white;
            margin: 3px;
            border:none;
            border-radius:8px}
         body{background-color: #d6f5ff;}
         a{color:#64b9ff ;
        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<h2>Calculadora</h2>

<label>Número 1:</label>
<input type="number" id="n1"><br><br>

<label>Número 2:</label>
<input type="number" id="n2"><br><br>

<button onclick="calcular()">Calcular</button>

<script>
function calcular() {
    var n1 = document.getElementById("n1").value;
    var n2 = document.getElementById("n2").value;

    if (n1 == "" || n2 == "") {
        alert("Preencha os dois números!");
        return;
    }

    n1 = parseFloat(n1);
    n2 = parseFloat(n2);

    var op = prompt("Escolha a operação: +  -  *  /");

    var resultado = 0;
    if (op == "+") {
        resultado = n1 + n2;
    } 
    else if (op == "-") {
        resultado = n1 - n2;
    } 
    else if (op == "*") {
        resultado = n1 * n2;
    } 
    else if (op == "/") {
        resultado = n1 / n2;
    } 
    else {
        alert("Operação inválida!");
        return;
    }
    var tipo = "";
    if (resultado % 2 == 0) {
        tipo += "Par | ";
    } else {
        tipo += "Ímpar | ";
    }
    if (resultado >= 0) {
        tipo += "Positivo | ";
    } else {
        tipo += "Negativo | ";
    }
    if (resultado == Math.floor(resultado)) {
        tipo += "Inteiro";
    } else {
        tipo += "Decimal";
    }
    alert("Resultado: " + resultado + " | " + tipo);
}
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
</html>
