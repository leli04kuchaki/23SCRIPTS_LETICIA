<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Folha de Pagamento</title>
    <style>
        header{
            text-align:center;
            padding:20px;
            background:#549bff;
            border-bottom:2px 
        }

        main{
            max-width:1000px;
            margin:auto;
            padding:20px; ;}
        section{
            background:#67a6ff;
            margin:20px 0;
            padding:20px;
            border-radius:15px}
           h1,h2{color:#005092}
          footer{text-align:center;
            padding: 60px;
            background-color: #549bff;
            
          } 
         button{padding:20px; 
            background-color: #5990dd;
            color:white;
            margin: 3px;
            border:none;
            border-radius:8px}
            button:hover{
                cursor: pointer;
            }
         body{background-color: #d6f5ff;}
         .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
          
          .meu-botao:hover {
            background-color: #0056b3;
          }
          
    </style>
    <script>


        function calcular() {
        
        
            var valorHora = Number(document.getElementById("hora").value);
        
            var horas = Number(document.getElementById("horas").value);
        
        
        
            var salarioBruto = valorHora * horas;
        
        
        
            var ir;
        
        
        
            if (salarioBruto <= 2112) {
        
                ir = 0;
        
            } 
            
            else if (salarioBruto <= 2826.65) {
        
                ir = salarioBruto * 0.075;
        
            } 
            
            else if (salarioBruto <= 3751.05) {
        
                ir = salarioBruto * 0.15;
        
            } 
            
            else if (salarioBruto <= 4664.68) {
        
                ir = salarioBruto * 0.225;
        
            } 
            
            else {
        
                ir = salarioBruto * 0.275;
        
            }
        
        
        
            var sindicato = salarioBruto * 0.03;
        
        
            var fgts = salarioBruto * 0.11;
        
        
            var descontos = ir + sindicato;
        
        
            var salarioLiquido = salarioBruto - descontos;
        
        
        
            document.getElementById("resultado").innerHTML =
        
        
            "Salário Bruto: R$ " + salarioBruto.toFixed(2) +
        
            "<br>IR: R$ " + ir.toFixed(2) +
        
            "<br>Sindicato (3%): R$ " + sindicato.toFixed(2) +
        
            "<br>FGTS (11%): R$ " + fgts.toFixed(2) +
        
            "<br>Descontos: R$ " + descontos.toFixed(2) +
        
            "<br><br>Salário Líquido: R$ " + salarioLiquido.toFixed(2);
        
        
        
        }
            
        
        
        </script>
        
        
        </head>
        
        
        <body>
        
        
        
        <div class="caixa">
        
        
        <h1>Folha de Pagamento</h1>
        
        
        
        <form>
        
        
        <input
        type="number"
        id="hora"
        placeholder="Valor da hora">
        
        
        
        <input
        type="number"
        id="horas"
        placeholder="Horas trabalhadas no mês">
        
        
        
        <button type="button" onclick="calcular()">
        
        Calcular Folha
        
        </button>

        
        
        
        </form>
        
        
        
        <div id="resultado"></div>
        
        
        
        </div>
        
        <a href="index.html" class="meu-botao">Voltar a pagina inicial</a>

        </body>
        
        </html>
</body>
</html>
