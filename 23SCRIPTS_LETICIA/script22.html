<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Posto de Combustível</title>
    <style>
        header{
            text-align:center;
            padding:20px;
            background:#549bff;
            border-bottom:2px 
        }

        main{
            max-width:1000px;
            margin:auto;
            padding:20px; ;}
        section{
            background:#67a6ff;
            margin:20px 0;
            padding:20px;
            border-radius:15px}
           h1,h2{color:#005092}
          footer{text-align:center;
            padding: 60px;
            background-color: #549bff;
            
          } 
         button{padding:20px; 
            background-color: #5990dd;
            color:white;
            margin: 3px;
            border:none;
            border-radius:8px}
         body{background-color: #d6f5ff;}
         a{color:#64b9ff ;
        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<script>
var litros = parseFloat(prompt("Digite a quantidade de litros:"));
var tipo = prompt("Digite o tipo de combustível (A-álcool / G-gasolina):");

var preco = 0;
var valor = 0;

if (tipo == "A" || tipo == "a") {
    preco = 4.39;

    valor = litros * preco;

    if (litros <= 20) {
        valor = valor - (valor * 0.03);
    } else {
        valor = valor - (valor * 0.05);
    }

} else if (tipo == "G" || tipo == "g") {
    preco = 6.79;

    valor = litros * preco;

    if (litros <= 20) {
        valor = valor - (valor * 0.04);
    } else {
        valor = valor - (valor * 0.06);
    }

} else {
    alert("Tipo de combustível inválido!");
}

alert("Valor a pagar: R$ " + valor.toFixed(2));
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
</html>
