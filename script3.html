<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        header{

            border-bottom:2px 
        }

        main{
            max-width:1000px;
            margin:auto;

        section{
            background:#67a6ff;

            border-radius:15px}
           h1,h2{color:#005092}

         a{color:#64b9ff ;
        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;

            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<h2>Maior Número</h2>

 <input type="number" id="n1"><br><br>
 <input type="number" id="n2"><br><br>
 <input type="number" id="n3"><br><br>

<button onclick="maior()">Verificar</button>

<script>
function maior() {
    var n1 = parseInt(document.getElementById("n1").value);
    var n2 = parseInt(document.getElementById("n2").value);
    var n3 = parseInt(document.getElementById("n3").value);

    var maior = n1;

    if (n2 > maior) {
        maior = n2;
    }

    if (n3 > maior) {
        maior = n3;
    }

    alert("O maior número é: " + maior);
}
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
