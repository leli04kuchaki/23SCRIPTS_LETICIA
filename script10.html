<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dias da Semana</title>
    <style>
        header{
            text-align:center;
            padding:20px;
            background:#549bff;
            border-bottom:2px 
        }

        main{
            max-width:1000px;
            margin:auto;
            padding:20px; ;}
        section{
            background:#67a6ff;
            margin:20px 0;
            padding:20px;
            border-radius:15px}
           h1,h2{color:#005092}
          footer{text-align:center;
            padding: 60px;
            background-color: #549bff;
            
          } 
         button{padding:20px; 
            background-color: #5990dd;
            color:white;
            margin: 3px;
            border:none;
            border-radius:8px}
         body{background-color: #d6f5ff;}
         a{color:#64b9ff ;
        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<h2>Descobrir o dia da semana</h2>

<button onclick="verificar()">Verificar dia</button>

<script>
function verificar() {

    var dia = parseInt(prompt("Digite um número de 1 a 7:"));

    if (dia == 1) {
        alert("Domingo");
    } else if (dia == 2) {
        alert("Segunda-feira");
    } else if (dia == 3) {
        alert("Terça-feira");
    } else if (dia == 4) {
        alert("Quarta-feira");
    } else if (dia == 5) {
        alert("Quinta-feira");
    } else if (dia == 6) {
        alert("Sexta-feira");
    } else if (dia == 7) {
        alert("Sábado");
    } else {
        alert("Valor inválido!");
    }

}
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
</html>
