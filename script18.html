<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Caixa Eletrônico</title>
    <style>
        header{
            text-align:center;
            padding:20px;
            background:#549bff;
            border-bottom:2px 
        }

        main{
            max-width:1000px;
            margin:auto;
            padding:20px; ;}
        section{
            background:#67a6ff;
            margin:20px 0;
            padding:20px;
            border-radius:15px}
           h1,h2{color:#005092}
          footer{text-align:center;
            padding: 60px;
            background-color: #549bff;
            
          } 
         button{padding:20px; 
            background-color: #5990dd;
            color:white;
            margin: 3px;
            border:none;
            border-radius:8px}
         body{background-color: #d6f5ff;}
         a{color:#64b9ff ;
        size: 20%;}
        .meu-botao {
            background-color: #64b9ff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
          }
    </style>
</head>
<body>

<h2>Caixa Eletrônico</h2>

<label>Valor do saque (10 a 900):</label>
<input type="number" id="valor">
<button onclick="sacar()">Sacar</button>

<script>
function sacar() {
    var valor = parseInt(document.getElementById("valor").value);

    if (isNaN(valor) || valor < 10 || valor > 900) {
        alert("Valor inválido. Digite entre 10 e 900 reais.");
        return;
    }

    var n100 = Math.floor(valor / 100);
    valor = valor % 100;

    var n50 = Math.floor(valor / 50);
    valor = valor % 50;

    var n20 = Math.floor(valor / 20);
    valor = valor % 20;

    var n10 = Math.floor(valor / 10);

    var resultado = "Notas fornecidas: ";

    if (n100 > 0) resultado += n100 + " de 100 ";
    if (n50 > 0) resultado += n50 + " de 50 ";
    if (n20 > 0) resultado += n20 + " de 20 ";
    if (n10 > 0) resultado += n10 + " de 10 ";

    alert(resultado);
}
</script>
<a href="index.html" class="meu-botao">Voltar a pagina inicial</a>
</body>
</html>
